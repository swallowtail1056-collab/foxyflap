<div id="gameWrapper">
  <div id="scoreBoard">
    <div id="scoreLeft">
      <span><span id="labelScore">スコア</span> <span id="score">0</span></span>
      <span><span id="labelBest">最高</span> <span id="best">0</span></span>
    </div>
    <div id="langBar">
      <button class="langBtn active" id="btnJa" onclick="setLang('ja')">🇯🇵</button>
      <button class="langBtn" id="btnEn" onclick="setLang('en')">🇬🇧</button>
      <button class="langBtn active" id="btnSound" type="button" aria-label="Sound">🔊</button>
    </div>
  </div>
  <canvas id="canvas" width="360" height="560"></canvas>
  <button id="shareXBtn" type="button">𝕏 スコアを投稿</button>
  <div id="hint">クリック / スペース / タップ でジャンプ</div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ── Palette ──────────────────────────────────────
const SKY_TOP    = '#87ceeb';
const SKY_BOT    = '#c8e8f0';
const GROUND_COL = '#6b3d1e';
const GRASS_COL  = '#3a7d2c';

// ── Language ─────────────────────────────────────
let LANG = 'ja';
const T = {
  ja: {
    score: 'スコア', best: '最高',
    hint: 'クリック / スペース / タップ でジャンプ',
    title: 'Foxy Flap 🦊',
    start: 'タップしてスタート！',
    startSub: 'Click / Space / Tap',
    dead: '💥 やられた！',
    newRecord: '🎉 新記録！',
    retry: 'タップして もう一度',
    shareBtn: '𝕏 スコアを投稿',
  },
  en: {
    score: 'Score', best: 'Best',
    hint: 'Click / Space / Tap to jump',
    title: 'Foxy Flap 🦊',
    start: 'Tap to Start!',
    startSub: 'Click / Space / Tap',
    dead: '💥 Game Over!',
    newRecord: '🎉 New Record!',
    retry: 'Tap to Play Again',
    shareBtn: '𝕏 Share Score',
  }
};
function setLang(lang) {
  LANG = lang;
  document.getElementById('btnJa').classList.toggle('active', lang === 'ja');
  document.getElementById('btnEn').classList.toggle('active', lang === 'en');
  document.getElementById('labelScore').textContent = T[lang].score;
  document.getElementById('labelBest').textContent = T[lang].best;
  document.getElementById('hint').textContent = T[lang].hint;
  document.getElementById('shareXBtn').textContent = T[lang].shareBtn;
  if (state === 'idle' || state === 'dead') {
    drawBg();
    for (const p of pipes) drawPipe(p.x, p.top, p.idx, p.gap || PIPE_GAP);
    drawFox(fox.x, fox.y, fox.vy);
    if (state === 'idle') drawIdle();
    if (state === 'dead') drawDead();
  }
}
function t(key) { return T[LANG][key]; }

// ── State ─────────────────────────────────────────
let state = 'idle'; // idle | playing | dead
let score = 0, best = 0;

// Fox
let fox = { x: 80, y: H/2, vy: 0, r: 18 };
const GRAVITY  = 0.38;
const JUMP_V   = -7;

// Pipes
let pipes = [];
const PIPE_W    = 48;
const PIPE_GAP  = 200;
const PIPE_SPD  = 1.6;
let pipeTimer   = 0;
const PIPE_INT  = 135;  // frames between pipes

// Ground
const GROUND_H  = 60;
const GY        = H - GROUND_H;

// ── Input ─────────────────────────────────────────
let deadAt = 0;
const DEAD_LOCK_MS = 900; // やられた直後のタップは無視（連打で広告を誤タップしないように）

function jump() {
  if (state === 'dead') {
    if (performance.now() - deadAt < DEAD_LOCK_MS) return;
    // 「もう一度」のタップで広告を出す（出たときはスタート画面に戻して待つ）
    if (requestAd()) { resetToIdle(); } else { restart(); }
    return;
  }
  if (state === 'idle') { state = 'playing'; startBGM(); }
  if (state === 'playing') { fox.vy = JUMP_V; playFlap(); }
}
canvas.addEventListener('click', jump);
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); }
});
canvas.addEventListener('touchstart', e => { e.preventDefault(); jump(); }, {passive:false});

// ── Audio ─────────────────────────────────────────
// 音のオン・オフ（前回の設定を覚えておく）
let soundOn = true;
try { soundOn = localStorage.getItem('foxySound') !== 'off'; } catch(e) {}
const soundBtnEl = document.getElementById('btnSound');
function updateSoundBtn() {
  soundBtnEl.textContent = soundOn ? '🔊' : '🔇';
  soundBtnEl.classList.toggle('active', soundOn);
}
function toggleSound() {
  soundOn = !soundOn;
  try { localStorage.setItem('foxySound', soundOn ? 'on' : 'off'); } catch(e) {}
  updateSoundBtn();
  if (!soundOn) stopBGM();
  else if (state === 'playing') startBGM();
}
// ボタンを押してもジャンプしないよう、イベントを止める
['touchstart', 'click'].forEach(ev => soundBtnEl.addEventListener(ev, e => { e.stopPropagation(); }, { passive: true }));
soundBtnEl.addEventListener('click', () => { toggleSound(); soundBtnEl.blur(); });
updateSoundBtn();

let audioCtx;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playFlap() {
  if (!soundOn) return;
  try {
    const ac = getAudio();
    const o = ac.createOscillator(); const g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.frequency.setValueAtTime(500, ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(750, ac.currentTime + 0.06);
    g.gain.setValueAtTime(0.12, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.1);
    o.start(); o.stop(ac.currentTime + 0.1);
  } catch(e) {}
}
function playScore() {
  if (!soundOn) return;
  try {
    const ac = getAudio();
    [523, 659, 784].forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.frequency.value = f; o.type = 'sine';
      const t = ac.currentTime + i * 0.08;
      g.gain.setValueAtTime(0.1, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
      o.start(t); o.stop(t + 0.12);
    });
  } catch(e) {}
}
function playDie() {
  if (!soundOn) return;
  try {
    const ac = getAudio();
    const o = ac.createOscillator(), g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.frequency.setValueAtTime(260, ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(70, ac.currentTime + 0.3);
    g.gain.setValueAtTime(0.2, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.35);
    o.start(); o.stop(ac.currentTime + 0.35);
  } catch(e) {}
}

// ── BGM (明るいゲーム風) ───────────────────
// 二重再生（輪唱）防止：
//  ・止めるときは、予約済みの音もまとめて消す（音量0にして切り離す）
//  ・次の周回は、前の周回が終わる時刻ちょうどに予約する（タイマーのずれで重ならない）
//  ・古いタイマーが残っていても、世代番号が違えば何もしない
let bgmTimer = null;
let bgmPlaying = false;
let bgmMaster = null;
let bgmGen = 0;
let bgmNext = 0;

// 明るいマーチ風BGM（オリジナル曲）116BPM・Cメジャー
// 音名→周波数
const NOTE = {
  C3:130.81, D3:146.83, E3:164.81, F3:174.61, G3:196.00, A3:220.00, B3:246.94,
  C4:261.63, D4:293.66, E4:329.63, F4:349.23, G4:392.00, A4:440.00, B4:493.88,
  C5:523.25, D5:587.33, E5:659.25, F5:698.46, G5:783.99, A5:880.00, B5:987.77,
  C6:1046.50, D6:1174.66
};
const STEP = 60 / 116 / 4; // 16分音符の長さ（秒）
// メロディ [音名, 16分音符いくつ分]（'-' は休み）
const MELODY = [
  ['G4',3], ['A4',1], ['B4',2], ['C5',2], ['D5',2], ['E5',2],
  ['D5',2], ['-',2], ['E5',3], ['F5',1], ['G5',2], ['E5',2],
  ['C5',4], ['-',4], ['F5',3], ['E5',1], ['D5',2], ['C5',2],
  ['B4',2], ['C5',2], ['D5',2], ['G4',2], ['C5',2], ['E5',2],
  ['D5',2], ['B4',2], ['C5',4], ['G4',2], ['-',2], ['E5',2],
  ['E5',1], ['E5',1], ['G5',2], ['E5',2], ['D5',2], ['D5',1],
  ['D5',1], ['F5',2], ['D5',2], ['C5',2], ['E5',2], ['G5',2],
  ['C6',2], ['B5',2], ['A5',2], ['G5',4], ['A5',3], ['G5',1],
  ['F5',2], ['E5',2], ['D5',2], ['E5',2], ['F5',2], ['D5',2],
  ['G5',2], ['E5',2], ['D5',2], ['B4',2], ['C5',2], ['G4',2],
  ['C5',2], ['-',2]
];
// ベース「ブン・チャ・ブン・チャ」（8分音符ずつ）
const BASS = [
  'C3', 'E4', 'G3', 'E4', 'G3', 'B3', 'D3', 'B3',
  'C3', 'E4', 'G3', 'E4', 'C3', 'E4', 'G3', 'E4',
  'F3', 'A3', 'C3', 'A3', 'G3', 'B3', 'D3', 'B3',
  'C3', 'E4', 'G3', 'E4', 'C3', 'E4', 'G3', 'E4',
  'C3', 'E4', 'G3', 'E4', 'G3', 'B3', 'D3', 'B3',
  'C3', 'E4', 'G3', 'E4', 'G3', 'B3', 'D3', 'B3',
  'F3', 'A3', 'C3', 'A3', 'G3', 'B3', 'D3', 'B3',
  'G3', 'B3', 'D3', 'B3', 'C3', 'E4', 'G3', 'E4'
];
const LOOP_LEN = MELODY.reduce((s, [, d]) => s + d, 0) * STEP;

function startBGM() {
  stopBGM();
  if (!soundOn) return;
  try {
    const ac = getAudio();
    if (ac.state === 'suspended') ac.resume();
    bgmPlaying = true;
    const gen = ++bgmGen;
    bgmMaster = ac.createGain();
    bgmMaster.gain.value = 0.5; // 全体の音量
    bgmMaster.connect(ac.destination);
    bgmNext = ac.currentTime + 0.05;
    scheduleLoop(ac, gen);
  } catch(e) {}
}

function playTone(ac, type, freq, t, dur, vol, cut) {
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = type;
  o.frequency.value = freq;
  const len = dur * (cut || 0.75); // 短く切って跳ねる感じに
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.01);
  g.gain.setValueAtTime(vol, t + len - 0.03);
  g.gain.linearRampToValueAtTime(0, t + len);
  o.connect(g); g.connect(bgmMaster);
  o.start(t); o.stop(t + len + 0.02);
}

function scheduleLoop(ac, gen) {
  if (!bgmPlaying || gen !== bgmGen || !bgmMaster) return;
  if (bgmNext < ac.currentTime) bgmNext = ac.currentTime + 0.05;
  const start = bgmNext;
  // メロディ（ピコピコした矩形波）
  let t = start;
  MELODY.forEach(([n, d]) => {
    const dur = d * STEP;
    if (n !== '-') playTone(ac, 'square', NOTE[n], t, dur, 0.09);
    t += dur;
  });
  // ベース（三角波）ブン（強め）・チャ（弱め）
  BASS.forEach((n, i) => {
    if (n !== '-') playTone(ac, 'triangle', NOTE[n], start + i * STEP * 2, STEP * 2, i % 2 === 0 ? 0.35 : 0.22, 0.6);
  });
  bgmNext = start + LOOP_LEN;
  const wait = Math.max(0, (bgmNext - ac.currentTime - 0.3) * 1000);
  bgmTimer = setTimeout(() => scheduleLoop(ac, gen), wait);
}

function stopBGM() {
  bgmPlaying = false;
  bgmGen++;
  if (bgmTimer) { clearTimeout(bgmTimer); bgmTimer = null; }
  if (bgmMaster) {
    const m = bgmMaster;
    bgmMaster = null;
    try {
      const ac = getAudio();
      m.gain.cancelScheduledValues(ac.currentTime);
      m.gain.setValueAtTime(m.gain.value, ac.currentTime);
      m.gain.linearRampToValueAtTime(0, ac.currentTime + 0.05);
      setTimeout(() => { try { m.disconnect(); } catch(e) {} }, 100);
    } catch(e) { try { m.disconnect(); } catch(e2) {} }
  }
}

// アプリを裏に回したらBGMを止め、戻ったら（プレイ中なら）再開
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    stopBGM();
  } else if (state === 'playing') {
    startBGM();
  }
});

// ── Images (キャッシュ強制破棄) ────────────────────
const v = Date.now();
const jennyImg = new Image();
jennyImg.src = './jenny.png?v=' + v;

const bgImg = new Image();
bgImg.src = './bg_forest.png?v=' + v;

function drawFox(x, y, vy) {
  ctx.save();
  const tilt = Math.max(-25, Math.min(25, vy * 3));
  ctx.translate(x, y);
  ctx.rotate(tilt * Math.PI / 180);
  const w = 60, h = 80;
  ctx.drawImage(jennyImg, -w/2, -h/2, w, h);
  ctx.restore();
}

// ── Obstacle drawing ──────────────────────────────
function drawPipe(px, topH, idx, gap) {
  gap = gap || PIPE_GAP;
  const botY = topH + gap;
  const type = idx % 2 === 0 ? 'tree' : 'brick';

  if (type === 'tree') {
    drawTree(px, topH, true);
    drawTree(px, botY, false);
  } else {
    drawBrick(px, topH, true);
    drawBrick(px, botY, false);
  }
}

function drawTree(px, endY, fromTop) {
  const tw = PIPE_W;
  const tg = ctx.createLinearGradient(px, 0, px + tw, 0);
  tg.addColorStop(0, '#8B5E3C'); tg.addColorStop(0.4, '#a0724a'); tg.addColorStop(1, '#6b3d1e');
  ctx.fillStyle = tg;
  if (fromTop) {
    ctx.fillRect(px + 10, 0, tw - 20, endY - 30);
  } else {
    ctx.fillRect(px + 10, endY + 30, tw - 20, GY - endY - 30);
  }

  const leafColors = ['#2d6e1a', '#3a8c22', '#4aaa2e'];
  const cx = px + tw / 2;
  if (fromTop) {
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = leafColors[i];
      ctx.beginPath();
      const fy = endY - 30 - i * 22;
      ctx.moveTo(cx, fy - 36);
      ctx.lineTo(cx - tw/2 - 8 + i*4, fy + 4);
      ctx.lineTo(cx + tw/2 + 8 - i*4, fy + 4);
      ctx.closePath();
      ctx.fill();
    }
  } else {
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = leafColors[i];
      ctx.beginPath();
      const fy = endY + 30 + i * 22;
      ctx.moveTo(cx, fy + 36);
      ctx.lineTo(cx - tw/2 - 8 + i*4, fy - 4);
      ctx.lineTo(cx + tw/2 + 8 - i*4, fy - 4);
      ctx.closePath();
      ctx.fill();
    }
  }
}

function drawBrick(px, endY, fromTop) {
  const tw = PIPE_W;
  const brickH = 14, brickW = 22;
  const drawBricks = (y1, y2) => {
    ctx.fillStyle = '#b5451b';
    ctx.fillRect(px, y1, tw, y2 - y1);
    for (let row = y1; row < y2; row += brickH) {
      const offset = Math.floor((row - y1) / brickH) % 2 === 0 ? 0 : brickW / 2;
      ctx.strokeStyle = '#7a2e0e';
      ctx.lineWidth = 1.5;
      for (let col = px - offset; col < px + tw; col += brickW) {
        ctx.strokeRect(col, row, brickW, brickH);
      }
      ctx.beginPath(); ctx.moveTo(px, row); ctx.lineTo(px + tw, row);
      ctx.stroke();
    }
  };
  const capH = 10;
  if (fromTop) {
    drawBricks(0, endY - capH);
    ctx.fillStyle = '#4aaa2e';
    ctx.fillRect(px - 4, endY - capH, tw + 8, capH + 2);
  } else {
    drawBricks(endY + capH, GY);
    ctx.fillStyle = '#4aaa2e';
    ctx.fillRect(px - 4, endY - 2, tw + 8, capH + 2);
  }
}

// ── Background ────────────────────────────────────
let bgOff = 0;
let groundOff = 0;

function drawBg() {
  const spd = state === 'playing' ? PIPE_SPD * 0.4 : 0;
  bgOff = (bgOff + spd) % 720;
  if (bgImg.complete && bgImg.naturalWidth > 0) {
    ctx.drawImage(bgImg, -bgOff, 0, 720, GY);
    ctx.drawImage(bgImg, 720 - bgOff, 0, 720, GY);
  } else {
    ctx.fillStyle = '#2d6e1a';
    ctx.fillRect(0, 0, W, GY);
  }

  ctx.fillStyle = '#5a8a1a';
  ctx.fillRect(0, GY, W, GROUND_H);

  groundOff = (groundOff + (state === 'playing' ? PIPE_SPD : 0)) % 18;
  const grassHeights = [32, 22, 40, 26, 36, 20, 30, 38, 28, 34, 22, 42, 24, 36];
  for (let gx = -groundOff - 18; gx < W + 18; gx += 6) {
    const hi = Math.floor((gx + groundOff) / 6 + 100) % grassHeights.length;
    const gh = grassHeights[hi];
    const sway = Math.sin((gx + groundOff) * 0.15 + Date.now() * 0.001) * 5;
    ctx.strokeStyle = (hi % 3 === 0) ? '#3a9e1a' : (hi % 3 === 1) ? '#5abf2e' : '#4aaa22';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(gx + 3, GY + 2);
    ctx.quadraticCurveTo(gx + 3 + sway * 0.6, GY - gh * 0.5, gx + 3 + sway, GY - gh);
    ctx.stroke();
  }
}

// ── Overlay ───────────────────────────────────────
function drawIdle() {
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.roundRect(W/2 - 110, H/2 - 70, 220, 130, 16);
  ctx.fill();

  ctx.fillStyle = '#ffd97d';
  ctx.font = 'bold 32px "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Foxy Flap 🦊', W/2, H/2 - 22);

  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.font = '16px "Segoe UI", sans-serif';
  ctx.fillText(t('start'), W/2, H/2 + 16);
  ctx.fillText(t('startSub'), W/2, H/2 + 38);
}

function drawDead() {
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath();
  ctx.roundRect(W/2 - 120, H/2 - 90, 240, 165, 16);
  ctx.fill();

  ctx.fillStyle = '#ff6b6b';
  ctx.font = 'bold 30px "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(t('dead'), W/2, H/2 - 45);

  ctx.fillStyle = '#ffd97d';
  ctx.font = 'bold 22px "Segoe UI", sans-serif';
  ctx.fillText(`${t('score')}: ${score}`, W/2, H/2 - 8);

  if (lastIsRecord) {
    ctx.fillStyle = '#a8e063';
    ctx.font = 'bold 15px "Segoe UI", sans-serif';
    ctx.fillText(t('newRecord'), W/2, H/2 + 18);
  } else {
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = '15px "Segoe UI", sans-serif';
    ctx.fillText(`${t('best')}: ${best}`, W/2, H/2 + 18);
  }

  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.font = '15px "Segoe UI", sans-serif';
  ctx.fillText(t('retry'), W/2, H/2 + 50);
}

function drawScore() {
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 38px "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  ctx.shadowColor = 'rgba(0,0,0,0.5)';
  ctx.shadowBlur = 6;
  ctx.fillText(score, W/2, 54);
  ctx.shadowBlur = 0;
}

// ── Collision ─────────────────────────────────────
function collides() {
  const fx = fox.x, fy = fox.y, fr = fox.r - 4;
  if (fy + fr >= GY || fy - fr <= 0) return true;
  for (const p of pipes) {
    if (fx + fr > p.x && fx - fr < p.x + PIPE_W) {
      if (fy - fr < p.top || fy + fr > p.top + (p.gap || PIPE_GAP)) return true;
    }
  }
  return false;
}

// ── Restart ───────────────────────────────────────
function resetGame() {
  fox = { x: 80, y: H/2, vy: 0, r: 18 };
  pipes = [];
  pipeTimer = 0;
  score = 0;
  document.getElementById('score').textContent = 0;
}
function restart() {
  hideShareBtn();
  resetGame();
  state = 'playing';
  startBGM();
}
function resetToIdle() {
  hideShareBtn();
  resetGame();
  state = 'idle';
}

// ── X（旧Twitter）にスコアを投稿 ─────────────────
let lastScore = 0, lastIsRecord = false;
const shareBtnEl = document.getElementById('shareXBtn');
function showShareBtn() { shareBtnEl.style.visibility = 'visible'; }
function hideShareBtn() { shareBtnEl.style.visibility = 'hidden'; }
function shareScoreOnX() {
  const inApp = !!(window.Android && typeof window.Android.openUrl === 'function');
  const pageUrl = inApp
    ? 'https://play.google.com/store/apps/details?id=com.kitsunechess.foxyflap'
    : 'https://flap.kitsunechess.com/';
  const text = LANG === 'ja'
    ? 'Foxy Flapでスコア' + lastScore + 'を達成！🦊' + (lastIsRecord ? '（自己ベスト更新！）' : '') + '\n#foxyflap'
    : 'I scored ' + lastScore + ' in Foxy Flap! 🦊' + (lastIsRecord ? ' (New personal best!)' : '') + '\n#foxyflap';
  const url = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(pageUrl);
  try {
    if (inApp) { window.Android.openUrl(url); return; }
  } catch (e) {}
  window.open(url, '_blank', 'noopener');
}
// ボタンを押してもゲームが再スタートしないよう、イベントを止める
['touchstart', 'click'].forEach(ev => shareBtnEl.addEventListener(ev, e => { e.stopPropagation(); }, { passive: true }));
shareBtnEl.addEventListener('click', () => { shareScoreOnX(); shareBtnEl.blur(); });

// ── 広告（Androidアプリのときだけ） ─────────────────
// アプリ側が「今回は広告を出す」と判断したら true が返る
function requestAd() {
  try {
    if (window.Android && typeof window.Android.showAd === 'function') {
      return window.Android.showAd() === true;
    }
  } catch (e) {
    console.error('広告呼び出しエラー:', e);
  }
  return false;
}

// ── Main loop ─────────────────────────────────────
function loop() {
  drawBg();

  if (state === 'playing') {
    fox.vy += GRAVITY;
    fox.y  += fox.vy;

    const pipeTotal = pipes.length;
    const dynInterval = pipeTotal < 1 ? 160 : score < 3 ? 190 : score < 5 ? 170 : score < 8 ? 150 : PIPE_INT;
    const dynGap = pipeTotal < 1 ? 220 : score < 3 ? 240 : score < 5 ? 225 : score < 8 ? 210 : PIPE_GAP;
    const dynSpd = pipeTotal < 1 ? 1.3 : score < 3 ? 1.2 : score < 5 ? 1.4 : score < 8 ? 1.5 : PIPE_SPD;
    pipeTimer++;
    if (pipeTimer >= dynInterval) {
      pipeTimer = 0;
      const top = 80 + Math.random() * (GY - dynGap - 120);
      pipes.push({ x: W + 10, top, scored: false, idx: pipes.length, gap: dynGap });
    }
    pipes = pipes.filter(p => p.x + PIPE_W > -20);
    for (const p of pipes) {
      p.x -= dynSpd;
      if (!p.scored && p.x + PIPE_W < fox.x) {
        p.scored = true;
        score++;
        document.getElementById('score').textContent = score;
        playScore();
      }
    }

    if (collides()) {
      state = 'dead';
      stopBGM();
      lastScore = score;
      lastIsRecord = score > best && score > 0;
      showShareBtn();
      if (score > best) {
        best = score;
        document.getElementById('best').textContent = best;
      }
      playDie();
      deadAt = performance.now();
    }
  }

  // Draw pipes
  for (const p of pipes) drawPipe(p.x, p.top, p.idx, p.gap || PIPE_GAP);

  // Draw fox
  drawFox(fox.x, fox.y, fox.vy);

  // Overlays
  if (state === 'idle') drawIdle();
  if (state === 'dead') drawDead();
  if (state === 'playing') drawScore();

  requestAnimationFrame(loop);
}

loop();

// ── Service Workerキャッシュの即時強制破棄 ──────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(registrations => {
    for (let registration of registrations) {
      registration.unregister();
    }
  });
}
</script>
